plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

providers.gradleProperty('customBuildDir').orNull?.with {
	layout.buildDirectory = file(it)
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.1'
	// AI팀 PMML 모델을 Spring Boot 프로세스 안에서 직접 추론한다.
	// metro는 PMML XML 언마샬링에 필요한 JAXB 런타임을 제공한다.
	implementation 'org.jpmml:pmml-evaluator:1.7.3'
	runtimeOnly 'org.jpmml:pmml-evaluator-metro:1.7.3'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
	developmentOnly 'com.h2database:h2'
	runtimeOnly 'com.mysql:mysql-connector-j'
	// Cloud Run이 --add-cloudsql-instances로 노출하는 유닉스 소켓으로 Cloud SQL에 접속한다.
	runtimeOnly 'com.google.cloud.sql:mysql-socket-factory-connector-j-8:1.21.0'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'com.h2database:h2'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
	// 최종 PMML(약 260MB, n_estimators=3000)은 적재 시 힙을 크게 쓰므로 기본 512MB로는
	// 실모델 스모크 테스트가 OOM으로 죽는다. 상주량 실측은 RealStandingModelSmokeTests 로그 참고.
	maxHeapSize = '4g'
}
