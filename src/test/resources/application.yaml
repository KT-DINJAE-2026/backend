spring:
  datasource:
    url: jdbc:h2:mem:backend;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  docker:
    compose:
      enabled: false

app:
  master-data:
    import-enabled: false
  # 실제 PMML 파일은 저장소에 없어 CI에서 받을 수 없다. 추론 테스트는 테스트용 소형 모델을 직접 적재한다.
  model:
    enabled: false
