spring:
  application:
    name: backend
  config:
    import: optional:file:.env[.properties]
  profiles:
    default: local

app:
  # CORS Origin은 프로필 YAML에서 이 목록을 재정의할 수 있다.
  cors:
    allowed-origins:
      - "http://localhost:5173"
      - "https://kd-dinjae-2026-fe.vercel.app"
  demo:
    enabled: false
  api:
    initial-destination-stop-ids:
      - "107000089"
      - "100000147"
  master-data:
    import-enabled: false
    city-name: "서울특별시"
    stop-file: ${MASTER_STOP_FILE:}
    route-file: ${MASTER_ROUTE_FILE:}
    route-stop-file: ${MASTER_ROUTE_STOP_FILE:}
  topis:
    enabled: ${SEOUL_BUS_API_ENABLED:true}
    base-url: ${SEOUL_BUS_API_BASE_URL:http://ws.bus.go.kr/api/rest}
    service-key: ${SEOUL_BUS_API_KEY:}
    connect-timeout: 3s
    request-timeout: 5s
    cache-ttl: 20s
  holiday:
    enabled: ${HOLIDAY_API_ENABLED:true}
    base-url: ${HOLIDAY_API_BASE_URL:https://apis.data.go.kr/B090041/openapi/service/SpcdeInfoService}
    # 공공데이터포털 API는 하나의 일반 인증키를 공통으로 사용한다.
    service-key: ${SEOUL_BUS_API_KEY:}
    connect-timeout: 3s
    request-timeout: 5s
    cache-ttl: 24h
  weather:
    enabled: ${WEATHER_API_ENABLED:true}
    base-url: ${WEATHER_API_BASE_URL:https://api.open-meteo.com/v1/forecast}
    connect-timeout: 3s
    request-timeout: 5s
    # 같은 정류장·시간대의 후보 차량들이 하루치 예보를 재사용한다.
    cache-ttl: 15m
  model:
    # 모델 파일은 저장소에 없으므로(models/README.md) 파일을 받지 못한 환경에서는 꺼야 한다.
    enabled: ${ML_MODEL_ENABLED:true}
    # 배포 이미지에서는 ML_MODEL_DIR=/models 를 주입한다.
    directory: ${ML_MODEL_DIR:models}
    classifier-file: model_a.pmml
    regressor-file: model_b.pmml

springdoc:
  swagger-ui:
    path: /swagger-ui.html

server:
  servlet:
    encoding:
      charset: UTF-8
      force-response: true
