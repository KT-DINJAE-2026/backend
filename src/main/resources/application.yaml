spring:
  application:
    name: backend
  config:
    import: optional:file:.env[.properties]
  profiles:
    default: local

app:
  api:
    initial-destination-stop-ids:
      - "121000021"
      - "121001344"
  master-data:
    import-enabled: false
    city-name: "서울특별시"
    stop-file: ${MASTER_STOP_FILE:}
    route-file: ${MASTER_ROUTE_FILE:}
    route-stop-file: ${MASTER_ROUTE_STOP_FILE:}
  topis:
    enabled: ${SEOUL_BUS_API_ENABLED:true}
    base-url: ${SEOUL_BUS_API_BASE_URL:http://ws.bus.go.kr/api/rest}
    service-key: ${SEOUL_BUS_API_KEY:}
    connect-timeout: 3s
    request-timeout: 5s
    cache-ttl: 20s
  prediction:
    sample-basis: ${PREDICTION_SAMPLE_BASIS:BOARDING_STOP}
    user-type-mode: ${PREDICTION_USER_TYPE_MODE:FIXED}
    fixed-user-type-code: ${PREDICTION_USER_TYPE_CODE:04}
    default-weather: ${PREDICTION_DEFAULT_WEATHER:맑음}
    min-sample-count: 30
    medium-confidence-sample-count: 100
    high-confidence-sample-count: 1000

springdoc:
  swagger-ui:
    path: /swagger-ui.html

server:
  servlet:
    encoding:
      charset: UTF-8
      force-response: true
