spring:
  datasource:
    url: jdbc:h2:file:${H2_DATABASE_PATH:./.local/backend-smoke};MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  docker:
    compose:
      enabled: false

logging:
  level:
    com.example.backend: INFO
