spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # 서비스는 validate로 기동한다. 최초 1회 스키마 생성은 backend-init Job이
      # DDL_AUTO=update로 재정의해 수행한다(docs/CLOUD_ARCHITECTURE.md).
      ddl-auto: ${DDL_AUTO:validate}
    open-in-view: false
  docker:
    compose:
      enabled: false

server:
  forward-headers-strategy: framework
